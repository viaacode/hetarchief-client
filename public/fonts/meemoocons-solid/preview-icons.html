			:root {
				--background: #fff;
				--surface: #f6f6f7;
				--border: #e2e2e5;
				--text: #1a1a1a;
				--text-muted: #6b6b70;
			}

			[data-theme="dark"] {
				--background: #1a1a1a;
				--surface: #262629;
				--border: #3a3a3f;
				--text: #f2f2f2;
				--text-muted: #9a9aa0;
			}

			* {
				box-sizing: border-box;
			}

			body {
				margin: 0;
				padding: 2rem;
				background: var(--background);
				color: var(--text);
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
				font-size: 14px;
			}

			header {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
				align-items: center;
				margin-bottom: 0.5rem;
			}

			h1 {
				margin: 0;
				font-size: 1.5rem;
			}

			.count {
				color: var(--text-muted);
				font-weight: normal;
				font-size: 0.875rem;
			}

			.hint {
				margin: 0 0 1.5rem;
				color: var(--text-muted);
			}

			.hint code {
				padding: 0.1em 0.4em;
				border-radius: 3px;
				background: var(--surface);
			}

			#search {
				flex: 1 1 16rem;
				padding: 0.5rem 0.75rem;
				border: 1px solid var(--border);
				border-radius: 4px;
				background: var(--background);
				color: inherit;
				font: inherit;
			}

			#theme-toggle {
				padding: 0.5rem 0.75rem;
				border: 1px solid var(--border);
				border-radius: 4px;
				background: var(--background);
				color: inherit;
				font: inherit;
				cursor: pointer;
			}

			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fill, minmax(9rem, 1fr));
				gap: 0.5rem;
			}

			.card {
				display: flex;
				flex-direction: column;
				gap: 0.5rem;
				align-items: center;
				padding: 1rem 0.5rem;
				border: 1px solid var(--border);
				border-radius: 4px;
				background: var(--surface);
				color: inherit;
				font: inherit;
				text-align: center;
				cursor: pointer;
			}

			.card:hover {
				border-color: var(--text-muted);
			}

			.card[hidden] {
				display: none;
			}

			/* Mirrors src/modules/shared/components/Icon/Icon.module.scss so the preview renders
			   exactly like the Icon component does. */
			.icon {
				font-family: meemoocons-solid;
				font-size: 2rem;
				line-height: 1;
				font-feature-settings: "liga";
				font-variant-ligatures: discretionary-ligatures;
				letter-spacing: 0;
				-webkit-font-smoothing: antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			.name {
				color: var(--text-muted);
				font-size: 0.75rem;
				word-break: break-word;
			}

			.empty {
				color: var(--text-muted);
			}

			#toast {
				position: fixed;
				right: 1.5rem;
				bottom: 1.5rem;
				padding: 0.6rem 1rem;
				border-radius: 4px;
				background: var(--text);
				color: var(--background);
				transition: opacity 0.15s;
			}

			#toast[hidden] {
				display: none;
			}
		</style>
	</head>

			<button type="button" class="card" data-name="zoom-out">
				<span class="icon">zoom-out</span>
				<span class="name">zoom-out</span>
			</button>
			<button type="button" class="card" data-name="">
				<span class="icon"></span>
				<span class="name"></span>
			</button>
		</div>
		<p class="empty" hidden>No icons match your search.</p>
		<div id="toast" hidden></div>
		<script>
			const search = document.getElementById('search');
			const toast = document.getElementById('toast');
			const themeToggle = document.getElementById('theme-toggle');
			const count = document.querySelector('.count');
			const empty = document.querySelector('.empty');
			let toastTimeout;

			search.addEventListener('input', () => {
				const query = search.value.trim().toLowerCase();
				let visible = 0;

				for (const card of document.querySelectorAll('.card')) {
					const matches = card.dataset.name.includes(query);
					card.hidden = !matches;
					visible += matches ? 1 : 0;
				}

				count.textContent = visible + ' icons';
				empty.hidden = visible > 0;
			});

			document.addEventListener('click', async (event) => {
				const card = event.target.closest('.card');

				if (!card) {
					return;
				}

				try {
					await navigator.clipboard.writeText(card.dataset.name);
					showToast('Copied ' + card.dataset.name);
				} catch {
					showToast('Could not copy to clipboard');
				}
			});

			themeToggle.addEventListener('click', () => {
				const dark = document.documentElement.dataset.theme === 'dark';
				document.documentElement.dataset.theme = dark ? 'light' : 'dark';
				themeToggle.textContent = dark ? 'Dark' : 'Light';
			});

			function showToast(message) {
				toast.textContent = message;
				toast.hidden = false;
				clearTimeout(toastTimeout);
				toastTimeout = setTimeout(() => {
					toast.hidden = true;
				}, 1500);
			}
		</script>
	</body>
</html>
